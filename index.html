<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Event Registration — Login</title>
<link rel="stylesheet" href="css/style.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon"><i class="ti ti-qrcode"></i></div>
      <div>
        <h1>Event Registration</h1>
        <p>Sistem Absensi Digital</p>
      </div>
    </div>

    <div id="login-form">
      <h2 class="auth-title">Masuk</h2>
      <p class="auth-sub">Silakan login dengan akun Anda</p>
      <div class="alert-msg" id="login-alert"></div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="email@contoh.com"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••"/>
      </div>
      <button class="btn btn-blue" onclick="doLogin()" id="btn-login">Masuk</button>
      <div class="auth-switch">Belum punya akun? <a onclick="showRegister()">Daftar sebagai Panitia</a></div>
    </div>

    <div id="register-form" style="display:none">
      <h2 class="auth-title">Daftar Akun</h2>
      <p class="auth-sub">Buat akun panitia baru</p>
      <div class="alert-msg" id="reg-alert"></div>
      <div class="form-group">
        <label>Nama Lengkap</label>
        <input type="text" id="reg-name" placeholder="Nama Anda"/>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="email@contoh.com"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="Minimal 6 karakter"/>
      </div>
      <button class="btn btn-blue" onclick="doRegister()" id="btn-reg">Daftar</button>
      <div class="auth-switch">Sudah punya akun? <a onclick="showLogin()">Masuk</a></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://brmpyrlmmvjrataeovdm.supabase.co'
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJybXB5cmxtbXZqcmF0YWVvdmRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNzUwODAsImV4cCI6MjA5NTk1MTA4MH0.XzlHNnJl7ZK3HRS4haM61NPPVJnri4-7EdQNHWG1SBo'
const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

function showAlert(id, msg, type) {
  const el = document.getElementById(id)
  el.textContent = msg
  el.className = 'alert-msg ' + type
  el.style.display = 'block'
}
function showLogin() {
  document.getElementById('login-form').style.display = 'block'
  document.getElementById('register-form').style.display = 'none'
}
function showRegister() {
  document.getElementById('login-form').style.display = 'none'
  document.getElementById('register-form').style.display = 'block'
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim()
  const password = document.getElementById('login-password').value
  if (!email || !password) { showAlert('login-alert', 'Isi semua field.', 'error'); return }
  const btn = document.getElementById('btn-login')
  btn.textContent = 'Memproses...'
  btn.disabled = true
  try {
    const { error } = await _supabase.auth.signInWithPassword({ email, password })
    if (error) {
      showAlert('login-alert', 'Email atau password salah.', 'error')
      btn.textContent = 'Masuk'; btn.disabled = false
      return
    }
    window.location.href = 'pages/dashboard.html'
  } catch(e) {
    showAlert('login-alert', 'Terjadi kesalahan: ' + e.message, 'error')
    btn.textContent = 'Masuk'; btn.disabled = false
  }
}

async function doRegister() {
  const name = document.getElementById('reg-name').value.trim()
  const email = document.getElementById('reg-email').value.trim()
  const password = document.getElementById('reg-password').value
  if (!name || !email || !password) { showAlert('reg-alert', 'Isi semua field.', 'error'); return }
  if (password.length < 6) { showAlert('reg-alert', 'Password minimal 6 karakter.', 'error'); return }
  const btn = document.getElementById('btn-reg')
  btn.textContent = 'Memproses...'; btn.disabled = true
  try {
    const { error } = await _supabase.auth.signUp({
      email, password,
      options: { data: { full_name: name, role: 'panitia' } }
    })
    if (error) {
      showAlert('reg-alert', error.message, 'error')
      btn.textContent = 'Daftar'; btn.disabled = false
      return
    }
    showAlert('reg-alert', 'Akun berhasil dibuat! Silakan login.', 'success')
    setTimeout(showLogin, 2000)
  } catch(e) {
    showAlert('reg-alert', 'Terjadi kesalahan: ' + e.message, 'error')
  }
  btn.textContent = 'Daftar'; btn.disabled = false
}

;(async () => {
  try {
    const { data } = await _supabase.auth.getSession()
    if (data.session) window.location.href = 'pages/dashboard.html'
  } catch(e) { console.log('Session check:', e) }
})()
</script>
</body>
</html>
